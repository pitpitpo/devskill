name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node / Python / Go
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: echo "Run project-specific linting and typecheck here"
